<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duoc UC - Verificación</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
        }

        /* Barra superior (Header) */
        .header {
            background-color: #191919;
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            width: 100%;
        }

        .logo-container {
            display: flex;
            align-items: center;
        }

        .logo-text {
            color: white;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-right: 5px;
            display: flex;
            align-items: center;
        }

        /* Simulación del escudo de DuocUC */
        .logo-crest {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.7);
            margin-left: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .logo-crest::after {
            content: "UC";
            font-size: 10px;
            color: rgba(255,255,255,0.7);
            font-weight: normal;
        }

        /* Menú Hamburguesa */
        .menu-icon {
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 20px;
            width: 30px;
        }

        .menu-icon div {
            width: 100%;
            height: 3px;
            background-color: white;
            border-radius: 1px;
        }

        /* Contenedor Principal */
        .main-content {
            display: flex;
            justify-content: center;
            padding-top: 30px;
        }

        /* Caja del reCAPTCHA */
        .recaptcha-box {
            background-color: #f9f9f9;
            border: 1px solid #d3d3d3;
            border-radius: 3px;
            width: 304px;
            height: 78px;
            padding: 0 12px 0 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: 0px 0px 4px rgba(0,0,0,0.08);
            position: relative;
        }

        .recaptcha-main {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: -8px;
        }
        
        .recaptcha-left {
            display: flex;
            align-items: center;
        }

        /* Checkbox que redirige */
        .checkbox-container {
            padding-top: 10px;
            cursor: pointer;
        }

        .checkbox {
            width: 28px;
            height: 28px;
            border: 2px solid #c1c1c1;
            border-radius: 2px;
            background-color: white;
            margin-right: 12px;
            transition: border-color 0.2s;
        }

        .checkbox-container:hover .checkbox {
             border-color: #b2b2b2;
        }

        .recaptcha-text {
            font-size: 14px;
            color: #222;
            padding-top: 10px;
        }

        /* Logo derecho de reCAPTCHA */
        .recaptcha-logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 10px;
        }

        .recaptcha-logo {
            width: 28px;
            height: 28px;
            margin-bottom: 2px;
        }

        .recaptcha-brand {
            font-size: 10px;
            color: #555;
        }

        /* Texto inferior (Enterprise) */
        .recaptcha-footer {
            font-size: 9px;
            color: #555;
            position: absolute;
            bottom: 6px;
            left: 12px;
            line-height: 1.2;
        }

        .recaptcha-footer a {
            color: #555;
            text-decoration: underline;
        }

    </style>
</head>
<body>

    <!-- Encabezado oscuro de Duoc UC -->
    <header class="header">
        <div class="logo-container">
            <span class="logo-text">DuocUC <div class="logo-crest"></div></span>
        </div>
        <div class="menu-icon">
            <div></div>
            <div></div>
            <div></div>
        </div>
    </header>

    <!-- Contenido con el Widget -->
    <main class="main-content">
        <div class="recaptcha-box">
            
            <div class="recaptcha-main">
                <!-- Sección izquierda: Checkbox y texto (Hacer clic aquí redirige a verifico.html) -->
                <div class="recaptcha-left">
                    <div class="checkbox-container" onclick="window.location.href='verifico.html'">
                        <div class="checkbox"></div>
                    </div>
                    <span class="recaptcha-text">No soy un robot</span>
                </div>
                
                <!-- Sección derecha: Logo de reCAPTCHA -->
                <div class="recaptcha-logo-container">
                    <!-- Icono SVG idéntico al de reCAPTCHA -->
                    <svg class="recaptcha-logo" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                        <path fill="#4285F4" d="M24,4 C30.6,4 36.4,7.3 39.8,12.4 L33.4,17 C31.3,13.6 27.9,11.3 24,11.3 C17,11.3 11.3,17 11.3,24 C11.3,24.8 11.4,25.6 11.6,26.3 L4.6,28.8 C4.2,27.3 4,25.7 4,24 C4,13 13,4 24,4 Z"/>
                        <path fill="#34A853" d="M39.8,12.4 L44.2,7 C44.2,7 44.5,12 44.5,12 L39.8,12.4 Z"/>
                        <path fill="#4285F4" d="M43.7,21 C43.9,22 44,23 44,24 C44,35 35,44 24,44 C17.3,44 11.4,40.6 8,35.4 L14.5,30.8 C16.5,34.4 20,36.7 24,36.7 C31,36.7 36.7,31 36.7,24 C36.7,23.3 36.6,22.6 36.4,21.8 L43.7,21 Z"/>
                        <path fill="#34A853" d="M8,35.4 L3.8,40.8 C3.8,40.8 3.5,35.8 3.5,35.8 L8,35.4 Z"/>
                    </svg>
                    <span class="recaptcha-brand">reCAPTCHA</span>
                </div>
            </div>

            <!-- Texto inferior -->
            <div class="recaptcha-footer">
                Este sitio supera la <a href="#">cuota gratuita de <br>reCAPTCHA Enterprise</a>
            </div>

        </div>
    </main>

</body>
</html>
